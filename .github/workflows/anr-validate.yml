name: ANR Validate

on:
  push:
  pull_request:

jobs:
  validate-anr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Validate ANR metadata
        run: node tools/anr-cli/index.js validate
