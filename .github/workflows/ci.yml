name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Basic repository checks
        run: |
          test -f AGENTS.md
          test -f README.md
          echo "Repository baseline checks passed."
