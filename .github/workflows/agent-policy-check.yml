name: Agent Policy Check

on:
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify agent policy files
        run: |
          test -f .agents/guardrails/architecture-rules.md
          test -f .agents/guardrails/forbidden-zones.md
          test -f AGENTS.md
          echo "Agent policy files are present."
