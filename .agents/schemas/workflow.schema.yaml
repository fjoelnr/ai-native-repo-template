$schema: "https://json-schema.org/draft/2020-12/schema"
title: Agent Workflow Schema
type: object
additionalProperties: false
required:
  - name
  - description
  - steps
  - inputs
  - outputs
  - required_tools
  - scripts
properties:
  name:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  steps:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
  inputs:
    type: array
    items:
      type: string
  outputs:
    type: array
    items:
      type: string
  required_tools:
    type: array
    items:
      type: string
  scripts:
    type: array
    items:
      type: string
