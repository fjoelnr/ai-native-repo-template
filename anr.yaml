anr_version: 0.2

repository:
  name: ai-native-repo-template
  type: template

agent_interface:
  global_context: AGENTS.md
  repository_map: .agents/context-index.md

directories:
  source: src
  tests: tests
  tools: tools
  documentation: docs

agent_components:
  skills: .agents/skills
  workflows: .agents/workflows
  guardrails: .agents/guardrails

capabilities:
  migration_supported: true
  validation_supported: true
  workflow_metadata: true
  skill_metadata: true
  memory_contract: false
  runtime_contract: true
  evals_contract: false

context_budget:
  startup:
    max_files_guidance: 3
    includes:
      - AGENTS.md
      - .agents/context-index.md
      - nearest AGENT.md
  on_demand:
    examples:
      - docs/
      - .agents/workflows/
      - .agents/skills/
      - .agents/guardrails/
  archive:
    path: .agents/archive
    load_by_default: false
  runtime:
    compact_outputs: true
    raw_output_recovery: preferred

runtime:
  mcp_servers: []
  local_tools:
    - id: anr-cli
      entrypoint: node tools/anr-cli/index.js
      purpose: initialize and validate repository structure
  privileged_operations: []

memory:
  enabled: false
  paths:
    summaries: .memory/summaries
    decisions: .memory/decisions
    working_state: .memory/working
  policy:
    source_of_truth: versioned_files
    retention: local_policy

evals:
  enabled: false
  paths:
    tasks: evals/tasks
    fixtures: evals/fixtures
    reports: evals/reports
  quality_gates: []

registry:
  profile: base
  skill_packs: []
  workflow_packs: []
